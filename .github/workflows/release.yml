name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image-and-chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Image
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/cyphra-dev/operator:${{ steps.v.outputs.version }}
            ghcr.io/cyphra-dev/operator:latest
      - uses: azure/setup-helm@v4
      - name: Chart (OCI)
        run: |
          helm package charts/cyphra-operator --version "${{ steps.v.outputs.version }}" --app-version "${{ steps.v.outputs.version }}"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "cyphra-operator-${{ steps.v.outputs.version }}.tgz" oci://ghcr.io/cyphra-dev/charts
