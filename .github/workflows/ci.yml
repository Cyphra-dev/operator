name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Vet and unit tests
        run: make test
      - name: Generated code and chart are up to date
        run: |
          make generate
          git diff --exit-code || (echo "Run 'make generate' and commit the result." && exit 1)
      - uses: azure/setup-helm@v4
      - name: Lint chart
        run: make lint-chart

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v4
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - name: End-to-end (kind)
        run: make e2e
