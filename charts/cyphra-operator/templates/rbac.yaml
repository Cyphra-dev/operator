apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cyphra-operator.fullname" . }}
  labels: {{- include "cyphra-operator.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cyphra-operator.fullname" . }}
  labels: {{- include "cyphra-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cyphra-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "cyphra-operator.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.leaderElection }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cyphra-operator.fullname" . }}-leader-election
  labels: {{- include "cyphra-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cyphra-operator.fullname" . }}-leader-election
  labels: {{- include "cyphra-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cyphra-operator.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "cyphra-operator.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
