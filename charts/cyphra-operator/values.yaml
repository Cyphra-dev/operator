image:
  repository: ghcr.io/cyphra-dev/operator
  # Defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicaCount: 1
# Required when replicaCount > 1.
leaderElection: false

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 256Mi

logLevel: info

# How often data volume usage (status.storage.usedBytes) is read from the kubelet stats summary.
# 0 disables it (and the need for the nodes/proxy permission).
usageRefreshInterval: 5m

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
