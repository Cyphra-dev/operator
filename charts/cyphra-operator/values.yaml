image:
  repository: ghcr.io/cyphra-dev/operator
  # Defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicaCount: 1
# Required when replicaCount > 1.
leaderElection: false

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 256Mi

logLevel: info

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
