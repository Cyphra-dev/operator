                x-kubernetes-list-type: map
              endpoint:
                description: Bolt URI clients use inside the cluster, e.g. neo4j://blog.default.svc:7687.
                type: string
              observedGeneration:
                format: int64
                type: integer
              passwordSecret:
                description: Secret (and key) holding the password.
                type: string
              phase:
                description: Phase is a coarse lifecycle state.
                enum:
                - Pending
                - Provisioning
                - Ready
                - BackingUp
                - Stopped
                - Failed
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
