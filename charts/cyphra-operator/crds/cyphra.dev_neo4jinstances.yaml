    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Neo4jInstance is a managed single-server Neo4j Community database.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Neo4jInstanceSpec is the desired state of a single-server
              Neo4j Community instance.
            properties:
              backup:
                description: Backup schedules offline dumps uploaded to S3-compatible
                  storage.
                properties:
                  retentionDays:
                    default: 7
                    description: Keep backups for this many days (older dumps under
                      the prefix are deleted). 0 keeps everything.
                    format: int32
                    minimum: 0
                    type: integer
                  s3:
                    description: S3Spec is an S3-compatible destination (AWS S3, MinIO,
                      R2, …).
                    properties:
                      bucket:
                        type: string
                      credentialsSecretName:
                        description: Secret with keys `accessKeyId` and `secretAccessKey`.
                        type: string
                      endpoint:
                        description: Endpoint URL for non-AWS providers, e.g. https://minio.example.com.
                        type: string
                      prefix:
                        description: Prefix inside the bucket; defaults to `<namespace>/<name>`.
                        type: string
                      region:
                        type: string
                    required:
                    - bucket
                    - credentialsSecretName
                    type: object
                  schedule:
                    description: Cron schedule (UTC), e.g. "0 3 * * *".
                    type: string
                  suspend:
                    description: Suspend stops scheduling new backups.
                    type: boolean
                required:
                - s3
                - schedule
                type: object
              config:
                additionalProperties:
                  type: string
                description: 'Config adds Neo4j settings, e.g. `db.transaction.timeout:
                  30s`. Keys are Neo4j setting names.'
                type: object
              image:
                description: Image overrides the container image (the version is then
                  ignored for the image).
                type: string
              passwordSecretRef:
                description: |-
                  PasswordSecretRef points to an existing Secret key holding the `neo4j` user's password.
                  When empty, the operator generates one in the Secret `<name>-auth` (key `password`).
                properties:
                  key:
                    description: The key of the secret to select from.  Must be a
                      valid secret key.
                    type: string
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                  optional:
                    description: Specify whether the Secret or its key must be defined
                    type: boolean
                required:
                - key
                type: object
                x-kubernetes-map-type: atomic
              resources:
                description: Resources for the Neo4j container. Heap and page cache
                  are sized from the memory limit.
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This field depends on the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              service:
                description: Service exposes Bolt (7687) and HTTP (7474).
                properties:
                  annotations:
                    additionalProperties:
                      type: string
                    description: Annotations for the Service (e.g. cloud load-balancer
                      settings).
                    type: object
                  type:
                    default: ClusterIP
                    description: Service Type string describes ingress methods for
                      a service
                    enum:
                    - ClusterIP
                    - LoadBalancer
                    - NodePort
                    type: string
                type: object
              stopped:
                description: Stopped scales the instance to zero while keeping its
                  data (e.g. to restore a dump).
                type: boolean
              storage:
                description: Storage for the data volume.
                properties:
                  size:
                    anyOf:
                    - type: integer
                    - type: string
                    default: 10Gi
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  storageClassName:
                    description: StorageClassName for the claim; empty uses the cluster
                      default.
                    type: string
                type: object
              tls:
                description: TLS enables encrypted Bolt and HTTPS using a `kubernetes.io/tls`
                  Secret (e.g. from cert-manager).
                properties:
                  secretName:
                    description: SecretName of a `kubernetes.io/tls` Secret with `tls.crt`
                      and `tls.key`.
                    type: string
                required:
                - secretName
                type: object
              version:
                default: "5.26"
                description: Neo4j version, used as the image tag `neo4j:<version>-community`.
                pattern: ^[0-9]+(\.[0-9]+){0,2}$
                type: string
            type: object
          status:
            description: Neo4jInstanceStatus is the observed state.
            properties:
              backup:
                description: BackupStatus records backup progress.
                properties:
                  activeJob:
                    description: Name of the backup Job currently running, if any.
                    type: string
                  lastScheduleTime:
                    format: date-time
                    type: string
                  lastSuccessfulKey:
                    description: Object key of the last successful dump.
                    type: string
                  lastSuccessfulTime:
                    format: date-time
                    type: string
                type: object
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
